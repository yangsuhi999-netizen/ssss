<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 뱀 게임 (Neon Snake Game)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at center, #1a103c 0%, #0b061a 100%);
            touch-action: manipulation;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* 네온 글로우 효과 스타일 (CSS) */
        .neon-border {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            border: 2px solid rgba(168, 85, 247, 0.6);
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);
        }

        .neon-text-pink {
            text-shadow: 0 0 8px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.4);
        }

        .btn-neon {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
        }

        .btn-neon:active {
            transform: translateY(1px);
        }

        /* 모바일 방향키 스타일 */
        .dpad-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            transition: background 0.1s, transform 0.1s;
        }

        .dpad-btn:active {
            background: rgba(168, 85, 247, 0.4);
            transform: scale(0.95);
        }

        canvas {
            background-color: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-between p-4 select-none">

    <!-- 메인 컨테이너 (HTML 구조) -->
    <div class="w-full max-w-md flex flex-col items-center gap-4 my-auto">
        
        <!-- 타이틀 및 점수판 -->
        <header class="w-full flex flex-col items-center gap-2">
            <h1 class="text-3xl font-black font-orbitron tracking-wider neon-text-cyan flex items-center gap-2">
                <span>🐍</span> NEON SNAKE
            </h1>
            
            <div class="w-full flex justify-between items-center bg-slate-900/80 px-5 py-3 rounded-2xl neon-border font-orbitron">
                <div class="flex flex-col items-start">
                    <span class="text-xs text-slate-400 tracking-wider">SCORE</span>
                    <span id="score" class="text-2xl font-bold text-cyan-400">0</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-xs text-slate-400 tracking-wider">HIGH SCORE</span>
                    <span id="high-score" class="text-2xl font-bold text-pink-500">0</span>
                </div>
            </div>
        </header>

        <!-- 게임 캔버스 영역 -->
        <div class="relative w-full aspect-square max-w-[400px]">
            <canvas id="gameCanvas" width="400" height="400" class="w-full h-full rounded-2xl neon-border block"></canvas>

            <!-- 시작 / 일시정지 / 게임오버 오버레이 (HTML) -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-10">
                <h2 id="overlay-title" class="text-3xl font-bold font-orbitron mb-2 neon-text-pink">GAME START</h2>
                <p id="overlay-msg" class="text-slate-300 text-sm mb-6">방향키나 버튼을 눌러 출발하세요!</p>
                <button id="start-btn" class="btn-neon px-8 py-3 rounded-full font-bold font-orbitron text-lg tracking-wider text-white">
                    PLAY NOW
                </button>
            </div>
        </div>

        <!-- 컨트롤 버튼 (PC 일시정지 및 음소거) -->
        <div class="w-full flex justify-between items-center px-2">
            <button id="pause-btn" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600 rounded-xl text-xs font-semibold tracking-wider flex items-center gap-1">
                <span>⏸️</span> PAUSE (Space)
            </button>
            <button id="sound-btn" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600 rounded-xl text-xs font-semibold tracking-wider flex items-center gap-1">
                <span id="sound-icon">🔊</span> SOUND ON
            </button>
        </div>

        <!-- 모바일 터치 패드 (HTML) -->
        <div class="w-full grid grid-cols-3 gap-2 max-w-[260px] my-2 md:hidden">
            <div></div>
            <button id="btn-up" class="dpad-btn aspect-square rounded-2xl flex items-center justify-center text-2xl font-bold active:bg-purple-600">▲</button>
            <div></div>
            <button id="btn-left" class="dpad-btn aspect-square rounded-2xl flex items-center justify-center text-2xl font-bold active:bg-purple-600">◄</button>
            <button id="btn-down" class="dpad-btn aspect-square rounded-2xl flex items-center justify-center text-2xl font-bold active:bg-purple-600">▼</button>
            <button id="btn-right" class="dpad-btn aspect-square rounded-2xl flex items-center justify-center text-2xl font-bold active:bg-purple-600">►</button>
        </div>

        <!-- 댓글 영역 (Disqus) -->
        <section class="w-full bg-slate-900/80 p-5 rounded-2xl neon-border mt-2 text-left">
            <h2 class="text-lg font-bold font-orbitron neon-text-cyan mb-4 flex items-center gap-2">
                <span>💬</span> COMMENTS
            </h2>
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://github-shvrin9lle.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>

    </div>

    <!-- 하단 설명 -->
    <footer class="text-xs text-slate-500 text-center my-2">
        PC: 키보드 방향키 / WASD | 모바일: 화면 버튼 사용
    </footer>

    <script>
        /* =================================================================
           JAVASCRIPT (JS) - 게임 로직, 상태 관리 및 캔버스 렌더링
           ================================================================= */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI 요소 참조
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');

        // 모바일 버튼 참조
        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        // 게임 설정 변수
        const GRID_SIZE = 20; // 20x20 그리드
        const TILE_COUNT = canvas.width / GRID_SIZE; // 각 타일 크기 (20px)
        
        let snake = [];
        let food = { x: 0, y: 0, type: 'normal' };
        let dx = 1; // X축 이동 방향
        let dy = 0; // Y축 이동 방향
        let nextDx = 1; // 연타 시 방향 버그 방지용
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameSpeed = 110; // 게임 루프 속도 (ms)
        let gameInterval = null;
        let isPaused = false;
        let isGameOver = false;
        let isGameStarted = false;
        let soundEnabled = true;

        highScoreEl.textContent = highScore;

        // Web Audio API를 이용한 음향 효과 (외부 라이브러리 없이 자체 합성)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'gameover') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        // 게임 초기화
        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            gameSpeed = 110;
            isPaused = false;
            isGameOver = false;
            scoreEl.textContent = score;
            spawnFood();
            draw();
        }

        // 먹이 랜덤 생성
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                
                // 뱀의 몸통 위에 먹이가 생성되지 않도록 검사
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
            // 20% 확률로 보너스 황금 먹이 생성
            food.type = Math.random() < 0.2 ? 'bonus' : 'normal';
        }

        // 게임 시작
        function startGame() {
            initAudio();
            playSound('click');
            initGame();
            isGameStarted = true;
            overlay.classList.add('hidden');
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        // 일시정지 토글
        function togglePause() {
            if (!isGameStarted || isGameOver) return;
            
            playSound('click');
            isPaused = !isPaused;

            if (isPaused) {
                clearInterval(gameInterval);
                overlayTitle.textContent = "PAUSED";
                overlayMsg.textContent = "게임이 일시정지 되었습니다.";
                startBtn.textContent = "RESUME";
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
        }

        // 게임 오버 처리
        function triggerGameOver() {
            isGameOver = true;
            isGameStarted = false;
            clearInterval(gameInterval);
            playSound('gameover');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_high_score', highScore);
                highScoreEl.textContent = highScore;
                overlayMsg.textContent = `축하합니다! 최고 점수 갱신: ${score}점`;
            } else {
                overlayMsg.textContent = `최종 점수: ${score}점`;
            }

            overlayTitle.textContent = "GAME OVER";
            startBtn.textContent = "RETRY";
            overlay.classList.remove('hidden');
        }

        // 핵심 게임 업데이트 루프
        function update() {
            dx = nextDx;
            dy = nextDy;

            // 새로운 머리 위치 계산
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 검사
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                triggerGameOver();
                return;
            }

            // 자기 몸통 충돌 검사
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                triggerGameOver();
                return;
            }

            // 머리 추가
            snake.unshift(head);

            // 먹이 획득 검사
            if (head.x === food.x && head.y === food.y) {
                const points = food.type === 'bonus' ? 30 : 10;
                score += points;
                scoreEl.textContent = score;
                playSound('eat');

                // 먹으면 약간씩 속도 증가 (최대 50ms까지)
                if (gameSpeed > 50) {
                    gameSpeed -= 1.5;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, gameSpeed);
                }

                spawnFood();
            } else {
                // 먹지 않았으면 꼬리 제거
                snake.pop();
            }
        }

        // 캔버스 그리기 함수
        function draw() {
            // 배경 지우기
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 그리드 선 그리기 (연한 네온 스타일)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += TILE_COUNT) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 먹이 그리기
            if (food.type === 'bonus') {
                // 보너스 먹이 (황금빛 발광 원)
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 15;
            } else {
                // 일반 먹이 (분홍빛 발광 원)
                ctx.fillStyle = '#ec4899';
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 12;
            }

            ctx.beginPath();
            ctx.arc(
                food.x * TILE_COUNT + TILE_COUNT / 2,
                food.y * TILE_COUNT + TILE_COUNT / 2,
                TILE_COUNT / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0; // 그림자 초기화

            // 뱀 그리기
            snake.forEach((segment, index) => {
                const isHead = index === 0;

                if (isHead) {
                    ctx.fillStyle = '#06b6d4'; // 머리: 시안 네온
                    ctx.shadowColor = '#22d3ee';
                    ctx.shadowBlur = 10;
                } else {
                    // 몸통: 그래디언트 느낌의 보라/청록
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(168, 85, 247, ${alpha})`;
                    ctx.shadowBlur = 0;
                }

                // 둥근 사각형 형태의 마디
                ctx.beginPath();
                ctx.roundRect(
                    segment.x * TILE_COUNT + 1,
                    segment.y * TILE_COUNT + 1,
                    TILE_COUNT - 2,
                    TILE_COUNT - 2,
                    isHead ? 6 : 4
                );
                ctx.fill();

                // 머리에 눈 그리기
                if (isHead) {
                    ctx.fillStyle = '#ffffff';
                    const eyeOffset = 5;
                    let eye1X = segment.x * TILE_COUNT + 5;
                    let eye1Y = segment.y * TILE_COUNT + 5;
                    let eye2X = segment.x * TILE_COUNT + 15;
                    let eye2Y = segment.y * TILE_COUNT + 5;

                    if (dx === 1) { // 오른쪽
                        eye1X = eye2X = segment.x * TILE_COUNT + 14;
                        eye1Y = segment.y * TILE_COUNT + 5;
                        eye2Y = segment.y * TILE_COUNT + 14;
                    } else if (dx === -1) { // 왼쪽
                        eye1X = eye2X = segment.x * TILE_COUNT + 5;
                        eye1Y = segment.y * TILE_COUNT + 5;
                        eye2Y = segment.y * TILE_COUNT + 14;
                    } else if (dy === 1) { // 아래
                        eye1Y = eye2Y = segment.y * TILE_COUNT + 14;
                        eye1X = segment.x * TILE_COUNT + 5;
                        eye2X = segment.x * TILE_COUNT + 14;
                    }

                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, 2, 0, Math.PI * 2);
                    ctx.arc(eye2X, eye2Y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.shadowBlur = 0;
        }

        // 전체 게임 메인 루프
        function gameLoop() {
            update();
            if (!isGameOver) {
                draw();
            }
        }

        // 방향 변경 처리
        function changeDirection(dir) {
            initAudio();
            if (isPaused) return;

            switch (dir) {
                case 'UP':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'DOWN':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'LEFT':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'RIGHT':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
            }
        }

        // 키보드 이벤트 리스너
        window.addEventListener('keydown', (e) => {
            // 댓글 작성 등 텍스트 입력창 조작 중일 경우 게임 조작 이벤트 무시
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable) {
                return;
            }

            // 화살표 스크롤 방지
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }

            if (!isGameStarted && e.code === 'Space') {
                startGame();
                return;
            }

            if (e.code === 'Space') {
                togglePause();
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('UP');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('DOWN');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('LEFT');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('RIGHT');
                    break;
            }
        });

        // 모바일 버튼 터치 리스너
        btnUp.addEventListener('click', () => changeDirection('UP'));
        btnDown.addEventListener('click', () => changeDirection('DOWN'));
        btnLeft.addEventListener('click', () => changeDirection('LEFT'));
        btnRight.addEventListener('click', () => changeDirection('RIGHT'));

        // UI 버튼 클릭 리스너
        startBtn.addEventListener('click', () => {
            if (isPaused) {
                togglePause();
            } else {
                startGame();
            }
        });

        pauseBtn.addEventListener('click', togglePause);

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
            soundBtn.classList.toggle('opacity-50', !soundEnabled);
        });

        // 최초 캔버스 랜더링 (대기 화면)
        initGame();
    </script>
</body>
